<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind',sans-serif;background:#020617;color:#e5e7eb}

/* HEADER */
header{
  background:#020617;
  border-bottom:2px solid #38bdf8;

  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo img{
  height:40px;
  width:auto;
}
.logo span{
  font-weight:700;
  color:#fff;
}
header a{
  color:#38bdf8;
  font-weight:700;
  text-decoration:none;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#1e90ff,#020617);
  text-align:center;
  padding:80px 20px;
}
.hero h1{
  font-family:'Poppins';
  color:#fff;
  font-size:36px;
}
.hero p{color:#c7d2fe;margin-top:8px}
.hero a{
  display:inline-block;
  margin-top:25px;
  padding:14px 40px;
  border-radius:40px;
  background:#22d3ee;
  color:#020617;
  font-weight:800;
  box-shadow:0 0 25px #22d3ee;
}

/* SEARCH */
.search{text-align:center;margin:30px}
.search input{
  padding:14px 20px;
  border-radius:30px;
  width:80%;
  max-width:420px;
  border:2px solid #38bdf8;
  background:#020617;
  color:#fff;
}

/* SECTIONS */
section{max-width:1200px;margin:60px auto;padding:0 20px}
h2{text-align:center;margin-bottom:30px;color:#38bdf8}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}
.card{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:18px;
  padding:22px;
  text-align:center;
  box-shadow:0 0 25px rgba(56,189,248,.4);
  transition:.3s;
}
.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 50px #38bdf8;
}
.card i{
  font-size:42px;
  color:#38bdf8;
  margin-bottom:10px;
}
.card h3{color:#fff}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:#020617;
  color:#fff;
  border:2px solid #38bdf8;
  border-radius:20px;
  padding:25px;
  width:90%;
  max-width:500px;
}
.modal-content ul{padding-left:18px}
.modal-content li{margin:10px 0}

/* FOOTER */
footer{
  background:#020617;
  border-top:2px solid #38bdf8;
  text-align:center;
  padding:30px;
  color:#94a3b8;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25d366;
  color:#fff;
  padding:16px;
  border-radius:50%;
  font-size:26px;
}
</style>
</head>

<body>

<header>

  <p>Uttar Pradesh ka trusted online portal</p>

<div class="search">
  <input type="text" placeholder="Search PAN, Aadhaar, Scholarship, Job…">
</div>

<section>

<div id="news" class="cards"></div>
</section>

<section>

<div class="cards">

<div class="card" onclick="openModal('cert')"><i class="fa-solid fa-file-lines"></i><h3>प्रमाण पत्र</h3></div>

<div class="card" onclick="openModal('digital')"><i class="fa-solid fa-desktop"></i><h3>Digital</h3></div>
</div>
</section>

<div class="modal" id="modal">
<div class="modal-content">
<div style="text-align:right;cursor:pointer" onclick="closeModal()">❌</div>
<ul id="modalList"></ul>
</div>
</div>

<footer>
© 2026 Nishchint Digital Seva | Uttar Pradesh
</footer>

<a class="whatsapp" href="https://wa.me/917497945260">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
const services={
student:["Scholarship","Fee Reimbursement","Exam Forms"],
cert:["Income","Caste","Domicile","Birth"],
gov:["Ayushman","PM Awas","E-Shram"],
id:["PAN","Aadhaar","Voter","Ration"],
job:["SSC","Railway","UP Police"],
digital:["Resume","Form Filling","Print","Bill Payment"]
};

function openModal(t){
let ul=document.getElementById("modalList");
ul.innerHTML="";
services[t].forEach(s=>ul.innerHTML+=`<li>${s}</li>`);
document.getElementById("modal").style.display="flex";
}
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* AUTO NEWS */
fetch(https://sheetdb.io/api/v1/pg210re7vg42k)
.then(r=>r.json())
.then(d=>{
let html="";
d.slice(0,6).forEach(n=>{
html+=`<div class="card"><h4>${n.Title}</h4><small>${n.Date}</small><br><a href="${n.Link}" target="_blank" style="color:#38bdf8">View</a></div>`;
});
document.getElementById("news").innerHTML=html;
});
</script>

</body>
</html>

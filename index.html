<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nishchint – Cyber Cafe & Digital Seva</title>
<meta name="description" content="Uttar Pradesh ka trusted cyber cafe aur online form filling service. Scholarship, PAN, Aadhaar, Yojana, Jobs – sab ek jagah.">

<link rel="manifest" href="/nishchint/manifest.json">
<meta name="theme-color" content="#0a3d62">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Hind&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Hind',sans-serif;
background:#0b1220;
color:#e5f0ff;
}

/* HEADER */
header{
background:#020b18;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
border-bottom:1px solid #1e90ff;
}
.logo{
display:flex;
align-items:center;
gap:10px;
}
.logo img{
height:40px;
width:auto;
}
.logo span{
font-size:20px;
font-family:'Poppins';
color:#38bdf8;
}
header a{
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

/* HERO */
.hero{
text-align:center;
padding:70px 20px;
background:linear-gradient(135deg,#020b18,#0a3d62);
}
.hero h1{
font-size:36px;
font-family:'Poppins';
}
.hero p{
margin:10px 0;
color:#9ddcff;
}
.hero a{
display:inline-block;
margin-top:20px;
padding:14px 35px;
border-radius:30px;
background:#25d366;
color:#fff;
text-decoration:none;
font-weight:700;
box-shadow:0 0 20px #25d366;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
50%{transform:scale(1.05)}
}

/* NEWS */
.news{
padding:50px 20px;
text-align:center;
}
.news h2{margin-bottom:20px}
.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.news-card{
background:#0a1f3a;
padding:20px;
border-radius:16px;
box-shadow:0 0 15px rgba(56,189,248,.3);
}
.news-card a{
color:#38bdf8;
text-decoration:none;
}

/* SERVICES */
.services{
padding:60px 20px;
text-align:center;
}
.service-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}
.service{
background:#0a1f3a;
padding:25px;
border-radius:16px;
transition:.3s;
}
.service:hover{
transform:translateY(-8px);
box-shadow:0 0 20px #38bdf8;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:#fff;
padding:16px;
border-radius:50%;
font-size:26px;
box-shadow:0 0 20px #25d366;
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
background:#020b18;
margin-top:50px;
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="/nishchint/logo.png">
<span>Nishchint</span>
</div>
<a href="https://wa.me/917497945260">WhatsApp</a>
</header>

<section class="hero">
<h1>Cyber Cafe & Digital Seva Near You</h1>
<p>Uttar Pradesh ke liye trusted digital portal</p>
<a href="https://wa.me/917497945260">Apply via WhatsApp</a>
</section>

<section class="news">
<h2>📰 Latest Sarkari Updates</h2>
<div id="news" class="news-grid"></div>
</section>

<section class="services">
<h2>हमारी सेवाएं</h2>
<div class="service-grid">
<div class="service">Scholarship</div>
<div class="service">PAN / Aadhaar</div>
<div class="service">Ration Card</div>
<div class="service">Pension</div>
<div class="service">Ayushman Card</div>
<div class="service">E-Shram</div>
<div class="service">Govt Jobs</div>
<div class="service">Certificates</div>
</div>
</section>

<footer>
© 2026 Nishchint Digital Seva | +91 7497945260
</footer>

<a class="whatsapp" href="https://wa.me/917497945260">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
// PASTE YOUR SHEETDB API LINK HERE
fetch https://sheetdb.io/api/v1/pg210re7vg42k
.then(r=>r.json())
.then(data=>{
let html="";
data.slice(0,6).forEach(n=>{
html+=`
<div class="news-card">
<b>${n.Title}</b><br>
<small>${n.Date}</small><br>
<a href="${n.Link}" target="_blank">Open</a>
</div>`;
});
document.getElementById("news").innerHTML=html;
});
</script>

</body>
</html>

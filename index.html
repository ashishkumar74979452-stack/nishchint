<style>
*{margin:0;padding:0;box-sizing:border-box}

/* HEADER */
header{

header img{height:36px}

}
.hero h1{font-family:'Poppins';font-size:32px}
.hero a{

display:inline-block;margin-top:15px;
text-decoration:none;font-weight:600
}

/* CARDS */
section{max-width:1200px;margin:50px auto;padding:0 20px}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px
}
.card{
background:#fff;
padding:30px 20px;
border-radius:20px;
text-align:center;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.12);
transition:.3s
}
.card:hover{transform:translateY(-8px)}
.card i{font-size:46px;color:#1e90ff;margin-bottom:10px}
.card h3{margin-top:10px}

/* MODAL */
.modal{
position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;align-items:center;justify-content:center;
z-index:999
}
.modal-content{
background:#fff;
width:90%;max-width:520px;
border-radius:20px;
padding:25px;
max-height:80vh;overflow:auto
}
.modal-content h2{text-align:center;margin-bottom:15px}
.modal-content ul{padding-left:20px}
.modal-content li{margin:10px 0}
.close{
text-align:right;font-size:18px;
cursor:pointer;font-weight:600
}
.apply{
margin-left:8px;
background:#25d366;color:#fff;
padding:4px 10px;border-radius:20px;
text-decoration:none;font-size:13px
}

/* FOOTER */
footer{
background:#0a3d62;color:#fff;
text-align:center;padding:25px;margin-top:50px
}

/* WHATSAPP */
.whatsapp{

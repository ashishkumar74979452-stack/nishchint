<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nishchint – Online Form Filling Help</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:#0b1220;
  color:#fff;
}

/* HEADER */
header{
  position:fixed;
  top:0;left:0;
  width:100%;
  padding:18px 60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(11,18,32,0.9);
  backdrop-filter:blur(12px);
  z-index:1000;
}
header h2{font-weight:700}
header nav a{
  color:#fff;
  margin-left:25px;
  text-decoration:none;
  font-size:15px;
  opacity:.8;
}
header nav a:hover{opacity:1}

/* HERO */
.hero{
  min-height:100vh;
  background:
  radial-gradient(circle at top right,#1ecbe1,transparent 40%),
  radial-gradient(circle at bottom left,#5c7cfa,transparent 40%),
  linear-gradient(120deg,#0b1220,#111b34);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:120px 20px;
}
.hero h1{
  font-size:56px;
  max-width:900px;
}
.hero p{
  margin-top:18px;
  font-size:18px;
  max-width:700px;
  opacity:.9;
}
.hero a{
  margin-top:35px;
  padding:16px 44px;
  background:linear-gradient(135deg,#25d366,#1db954);
  color:#000;
  font-weight:700;
  border-radius:50px;
  text-decoration:none;
}

/* SERVICES */
.services{
  background:#0e162b;
  padding:100px 20px;
  text-align:center;
}
.services h2{font-size:36px;margin-bottom:60px}
.cards{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:35px;
}
.card{
  background:rgba(255,255,255,0.08);
  border-radius:22px;
  padding:40px 30px;
  font-size:17px;
  font-weight:600;
  backdrop-filter:blur(10px);
  box-shadow:0 30px 60px rgba(0,0,0,.4);
  transition:.35s;
}
.card:hover{
  transform:translateY(-12px) scale(1.03);
  background:rgba(255,255,255,.12);
}

/* FOOTER */
footer{
  background:#000;
  padding:18px;
  text-align:center;
  font-size:14px;
  opacity:.85;
}

@media(max-width:768px){
  header{padding:16px 20px}
  .hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
  <h2>Nishchint</h2>
  <nav>
    <a href="#services">Services</a>
  </nav>
</header>

<section class="hero">
  <h1>Form Filling Made Easy & Trusted</h1>
  <p>Sarkari, Bank aur Education forms ke liye ek premium online service</p>
  <a href="https://wa.me/91XXXXXXXXXX">WhatsApp Now</a>
</section>

<section class="services" id="services">
  <h2>Our Services</h2>
  <div class="cards">
    <div class="card">Government Form Filling</div>
    <div class="card">Aadhaar / PAN / Voter ID</div>
    <div class="card">Bank & Loan Forms</div>
    <div class="card">Scholarship & Admission</div>
